<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>로그인 서버</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">L</div>
        <p class="eyebrow">WELCOME</p>
        <h1 id="page-title">로그인 서버</h1>
        <p class="subtitle">계정을 만들고 안전하게 로그인하세요.</p>

        <div id="account-view" class="hidden" aria-live="polite">
          <div class="welcome-box">
            <span class="welcome-icon" aria-hidden="true">✓</span>
            <h2>로그인되었습니다</h2>
            <p id="account-email"></p>
          </div>
          <button id="logout-button" class="button button-secondary" type="button">
            로그아웃
          </button>
        </div>

        <div id="auth-view">
          <div class="tabs" role="tablist" aria-label="계정 메뉴">
            <button
              class="tab active"
              id="login-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="auth-form"
            >
              로그인
            </button>
            <button
              class="tab"
              id="register-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="auth-form"
            >
              회원가입
            </button>
          </div>

          <form id="auth-form">
            <label for="email">이메일</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              maxlength="254"
              required
            />

            <div class="password-label">
              <label for="password">비밀번호</label>
              <span>8자 이상</span>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
              minlength="8"
              maxlength="128"
              required
            />

            <p id="message" class="message" role="status" aria-live="polite"></p>
            <button id="submit-button" class="button" type="submit">로그인</button>
          </form>
          <p class="privacy-note">
            계정 정보는 이 서버에 저장되며 비밀번호는 암호화된 해시로 보관됩니다.
          </p>
        </div>
      </section>
      <footer>간단한 Express 로그인 예제</footer>
    </main>
  </body>
</html>
